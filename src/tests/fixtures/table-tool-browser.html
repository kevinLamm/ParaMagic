<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ParaMagic Table Tool Browser Test</title>
  <style>
    body { margin: 24px; background: #f4f4f4; color: #202020; font: 16px/1.4 Arial, sans-serif; }
    main { max-width: 960px; margin: auto; padding: 24px; border: 1px solid #d0d0d0; background: white; }
    #status[data-state="passed"] { color: #126b2d; }
    #status[data-state="failed"] { color: #a21d1d; }
    #canvas { display: block; width: 900px; height: 500px; border: 1px solid #d0d0d0; background: white; }
    #exported-png { display: block; max-width: 900px; max-height: 500px; margin-top: 20px; border: 1px solid #d0d0d0; background: white; }
    .table-cell { pointer-events: none; }
    .table-cell-background, .table-cell-editor-host, .table-cell-editor { pointer-events: all; }
    .table-cell-editor { box-sizing: border-box; width: 100%; height: 100%; margin: 0; border: 0; background: transparent; resize: none; }
    .table-cell-editor.editing { background: rgb(255 255 255 / 92%); outline: 2px solid #315bb5; }
    .table-column-selector, .table-row-selector { fill: transparent; stroke: #8a8a8a; pointer-events: all; }
    .table-context-toolbar { overflow: visible; pointer-events: none; }
    .image-context-toolbar-content { display: flex; gap: 2px; width: 200px; height: 34px; padding: 1px; border: 1px solid #aaa; background: white; pointer-events: auto; }
    .image-toolbar-button { width: 30px; height: 30px; min-width: 30px; padding: 2px; }
    .image-toolbar-button svg { width: 24px; height: 24px; fill: none; stroke: #636363; stroke-width: 1.5; }
    .table-cell-background.selected { stroke: #0000ff; stroke-width: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Table tool browser test</h1>
    <p id="status" data-state="running">Testing the Table toolbar and keyboard navigation…</p>
    <pre id="details"></pre>
    <svg id="canvas" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500">
      <g id="objects"></g>
      <g id="handles"></g>
      <g id="preview"></g>
    </svg>
    <img id="exported-png" alt="Exported table PNG" hidden />
  </main>
  <script type="module" src="./table-tool-browser.js"></script>
</body>
</html>
